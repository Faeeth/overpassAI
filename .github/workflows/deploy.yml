name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time; a newer push supersedes a queued one rather than
# racing it, but an in-flight deploy is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check types
        run: npx tsc -b --noEmit

      - name: Run tests
        run: npx vitest run

      - name: Build
        env:
          # Optional. Set it under Settings -> Secrets and variables -> Actions
          # -> Variables to enable OpenStreetMap sign-in on the deployed site.
          # The client id is public by design and ships in the bundle.
          VITE_OSM_CLIENT_ID: ${{ vars.VITE_OSM_CLIENT_ID }}
          # Matches the repository name, which is the GitHub Pages subpath.
          BASE_PATH: /overpassAI/
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
